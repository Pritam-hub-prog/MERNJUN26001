<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        p{
            background-color: blue;
            font-size: 40px;
            color: green;
        }
        h2{
            background-color: gray;
        }

    </style>
    
</head>
<body>
    <!--image-->
    <img src="https://media.istockphoto.com/id/1203919740/photo/tiger.jpg?s=612x612&w=0&k=20&c=jhP4esxkZvajRFZJzvgfXGWZp9YUc0ct-VkIi70GjxU=" alt="tiger image" width="100">

    <!--video-->
    <video src="./video/ceickett.mp4" width="200" height="200" muted controls loop></video>

    <!--audio-->
    <audio src=""></audio>

    <!--select-->
    <select name="" id="">
        <option value="1">IND</option>
        <option value="2">AUS</option>
        <option value="3">SA</option>
        <option value="4">AMERICA</option>
    </select>

    <!--input type = "text"-->

    <textarea name="" id="" rows="3" cols="6"></textarea>

    <nav>nav bar</nav>

    <!--non-sematic tag--->

    <div style="background-color: green;">
        div bar
    </div>

    <span style="background-color: red;">span bar</span>
    


    <!--css-->
    <!--ther are three ways to add the css in html
    1 - inline
    2 - intrnal
    3 - external
    -->
    <!--inline-->
    
    <h1 style="background-color: blue;">This is heading</h1>

    <!--internal-->
    <p>this is the paragraph</p>

    <!--External -->
    <h2>second paragraph</h2>



  
    
</body>
</html>
